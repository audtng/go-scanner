rules:
  - id: http-web-path-traversal
    mode: taint
    severity: ERROR
    message: Untrusted user input from an HTTP request or web framework flows into a filesystem operation without path traversal sanitization, allowing arbitrary file read/write/delete.
    languages: [go]
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: HIGH
    paths:
      exclude: ['*_test.go', 'test/**/*.go', 'mock/**/*.go']
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: '($REQ : *http.Request).URL.Path'
      - pattern: '($REQ : *http.Request).URL.RawPath'
      - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
      - pattern: '($REQ : *http.Request).FormValue(...)'
      - pattern: '($REQ : *http.Request).PostFormValue(...)'
      - pattern: '($REQ : *http.Request).Header.Get(...)'
      - pattern: '($REQ : *http.Request).Cookie(...)'
      - pattern: '($REQ : *http.Request).PathValue(...)'
      - pattern: '($FH : *multipart.FileHeader).Filename'
      - pattern: '($PART : *multipart.Part).FileName()'
      - pattern: '($C : *gin.Context).Query(...)'
      - pattern: '($C : *gin.Context).Param(...)'
      - pattern: '($C : *gin.Context).PostForm(...)'
      - pattern: '($C : *gin.Context).GetHeader(...)'
      - pattern: '($C : echo.Context).FormValue(...)'
      - pattern: '($C : echo.Context).QueryParam(...)'
      - pattern: '($C : echo.Context).Param(...)'
      - pattern: '($C : *fiber.Ctx).Query(...)'
      - pattern: '($C : *fiber.Ctx).Params(...)'
      - pattern: '($C : *fiber.Ctx).FormValue(...)'
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: fmt.Sprintf(...)
        patterns:
          - pattern: fmt.Sprintf(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - pattern: securejoin.SecureJoin(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: filepath.IsLocal($X)
              - pattern: fs.ValidPath($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Open($PATH)
              - pattern: os.ReadFile($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.CreateTemp(..., $PATH)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.Stat($PATH)
              - pattern: http.Dir($PATH)
              - pattern: http.ServeFile($W, $REQ, $PATH)
              - pattern: '($C : *gin.Context).File($PATH)'
              - pattern: '($C : *gin.Context).FileAttachment($PATH, ...)'
              - pattern: '($C : echo.Context).File($PATH)'
              - pattern: '($C : echo.Context).Attachment($PATH, ...)'
              - pattern: '($C : echo.Context).Inline($PATH, ...)'
              - pattern: '($C : *fiber.Ctx).SendFile($PATH, ...)'
              - pattern: '($C : *fiber.Ctx).Download($PATH, ...)'
          - focus-metavariable: $PATH

  - id: archive-zipslip-path-traversal
    mode: taint
    severity: ERROR
    message: Untrusted archive entry path extracted from archive headers can lead to path traversal (Zip Slip / Tar Slip).
    languages: [go]
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: HIGH
    paths:
      exclude: ['*_test.go', 'test/**/*.go', 'mock/**/*.go']
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: '($FILE : *zip.File).Name'
      - pattern: '($FILE : zip.File).Name'
      - pattern: '($FILE : *zip.FileHeader).Name'
      - pattern: '($HDR : *tar.Header).Name'
      - pattern: '($HDR : tar.Header).Name'
      - pattern: '($HDR : *tar.Header).Linkname'
      - pattern: '($READER : *zip.Reader).File'
      - pattern: '($READER : *zip.ReadCloser).File'
      - patterns:
          - pattern: $TR.Next()
          - pattern-either:
              - pattern-inside: |
                  $TR := tar.NewReader(...)
                  ...
              - pattern-inside: |
                  $TR, ... := tar.NewReader(...)
                  ...
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: filepath.IsLocal($X)
              - pattern: filepath.Rel(..., $X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.Symlink(..., $PATH)
              - pattern: os.Link(..., $PATH)
          - focus-metavariable: $PATH

  - id: unmarshaled-config-path-traversal
    mode: taint
    severity: ERROR
    message: Untrusted path extracted from unmarshaled configuration data is used in a filesystem operation without validation.
    languages: [go]
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: HIGH
    paths:
      exclude: ['*_test.go', 'test/**/*.go', 'mock/**/*.go']
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.Unmarshal($DATA, &$TARGET)
              - pattern: yaml.Unmarshal($DATA, &$TARGET)
              - pattern: xml.Unmarshal($DATA, &$TARGET)
              - pattern: toml.Unmarshal($DATA, &$TARGET)
              - pattern: '($DEC : *json.Decoder).Decode(&$TARGET)'
              - pattern: '($DEC : *xml.Decoder).Decode(&$TARGET)'
              - pattern: '($C : *gin.Context).BindJSON(&$TARGET)'
              - pattern: '($C : *gin.Context).ShouldBind(&$TARGET)'
              - pattern: '($C : echo.Context).Bind(&$TARGET)'
              - pattern: '($C : *fiber.Ctx).BodyParser(&$TARGET)'
          - focus-metavariable: $TARGET
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Open($PATH)
              - pattern: os.Create($PATH)
              - pattern: os.ReadFile($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
          - focus-metavariable: $PATH

  - id: untrusted-config-exec-injection
    mode: taint
    severity: ERROR
    message: Untrusted data from parsed configuration is passed into command execution, potentially leading to command or argument injection.
    languages: [go]
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
    paths:
      exclude: ['*_test.go', 'test/**/*.go', 'mock/**/*.go']
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.Unmarshal($DATA, &$TARGET)
              - pattern: yaml.Unmarshal($DATA, &$TARGET)
              - pattern: xml.Unmarshal($DATA, &$TARGET)
              - pattern: toml.Unmarshal($DATA, &$TARGET)
          - focus-metavariable: $TARGET
    pattern-propagators:
      - from: $FROM
        to: fmt.Sprintf(...)
        patterns:
          - pattern: fmt.Sprintf(..., $FROM, ...)
      - from: $FROM
        to: append(...)
        patterns:
          - pattern: append(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseBool(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec.Command($ARG, ...)
              - pattern: exec.Command(..., $ARG, ...)
              - pattern: exec.CommandContext($CTX, $ARG, ...)
              - pattern: os.StartProcess($ARG, ...)
              - pattern: syscall.Exec($ARG, ...)
          - focus-metavariable: $ARG

  - id: protocol-system-path-traversal
    mode: taint
    severity: ERROR
    message: Untrusted system environment variables or SFTP inputs used in file path operation.
    languages: [go]
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      category: security
      confidence: HIGH
    paths:
      exclude: ['*_test.go', 'test/**/*.go', 'mock/**/*.go']
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: '($REQ : *sftp.Request).Filepath'
      - pattern: '($REQ : *sftp.Request).Target'
      - pattern: os.Getenv(...)
      - pattern: os.LookupEnv(...)
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.ReadFile($PATH)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
          - focus-metavariable: $PATH

  - id: go-url-path-rawpath-desync
    mode: taint
    severity: ERROR
    message: Detected manipulation of URL.RawPath using values derived from URL.Path without proper URL canonicalization, risking authentication/authorization bypass via desync.
    languages: [go]
    metadata:
      cwe: ["CWE-706: Use of Incorrectly-Resolved Name or Reference"]
      category: security
      confidence: HIGH
    paths:
      exclude: ['*_test.go', 'test/**/*.go', 'mock/**/*.go']
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: '($REQ : *http.Request).URL.Path'
    pattern-propagators:
      - from: $FROM
        to: strings.TrimPrefix(...)
        patterns:
          - pattern: strings.TrimPrefix($FROM, ...)
      - from: $FROM
        to: strings.ReplaceAll(...)
        patterns:
          - pattern: strings.ReplaceAll(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: url.PathEscape(...)
      - pattern: '($REQ : *http.Request).URL.JoinPath(...)'
      - by-side-effect: true
        patterns:
          - pattern: '($REQ : *http.Request).URL.RawPath = ""'
          - focus-metavariable: $REQ
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '($REQ : *http.Request).URL.RawPath = $VAL'
          - focus-metavariable: $VAL

  - id: missing-path-separator-glob-compile
    mode: taint
    severity: ERROR
    message: Glob pattern compiled without specifying a path boundary separator.
    languages: [go]
    metadata:
      cwe: ["CWE-285: Improper Authorization"]
      category: security
      confidence: HIGH
    paths:
      exclude: ['*_test.go', 'test/**/*.go', 'mock/**/*.go']
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: '($REQ : *http.Request).URL.Path'
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: glob.Compile($PATH)
              - pattern: glob.MustCompile($PATH)
          - focus-metavariable: $PATH

  - id: sqlite-vtab-path-traversal
    mode: taint
    severity: ERROR
    message: Untrusted argument from SQLite virtual table callback flows directly into a file system operation.
    languages: [go]
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      category: security
      confidence: HIGH
    paths:
      exclude: ['*_test.go', 'test/**/*.go', 'mock/**/*.go']
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  func ($RECV $TYPE) Connect(..., $ARGS []string, ...) (..., error) { ... }
              - pattern: |
                  func Connect(..., $ARGS []string, ...) (..., error) { ... }
          - focus-metavariable: $ARGS
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($PATH)
              - pattern: os.ReadFile($PATH)
          - focus-metavariable: $PATH
