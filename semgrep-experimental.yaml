- id: go-exec-untrusted-config-injection
  mode: taint
  severity: ERROR
  message: Untrusted data from parsed configuration or serialized format is passed
    into command execution. An attacker who controls configuration or annotations
    could inject arbitrary commands or flags, potentially leading to command injection
    or unauthorized host actions.
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS
      Command Injection'')'
    - 'CWE-88: Improper Neutralization of Argument Delimiters in a Command (''Argument
      Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    confidence: HIGH
    impact: HIGH
    likelihood: MEDIUM
    references:
    - https://cwe.mitre.org/data/definitions/78.html
    - https://cwe.mitre.org/data/definitions/88.html
    - https://owasp.org/Top10/A03_2021-Injection/
  languages:
  - go
  options:
    taint_assume_safe_booleans: true
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  pattern-sources:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: json.Unmarshal($DATA, &$TARGET)
      - pattern: yaml.Unmarshal($DATA, &$TARGET)
      - pattern: xml.Unmarshal($DATA, &$TARGET)
      - pattern: toml.Unmarshal($DATA, &$TARGET)
      - pattern: json.NewDecoder(...).Decode(&$TARGET)
      - pattern: yaml.NewDecoder(...).Decode(&$TARGET)
      - pattern: xml.NewDecoder(...).Decode(&$TARGET)
    - focus-metavariable: $TARGET
  pattern-propagators:
  - from: $FROM
    to: fmt.Sprintf(...)
    patterns:
    - pattern: fmt.Sprintf(..., $FROM, ...)
  - from: $FROM
    to: strings.Join(...)
    patterns:
    - pattern: strings.Join(..., $FROM, ...)
  - from: $FROM
    to: strings.Split(...)
    patterns:
    - pattern: strings.Split(..., $FROM, ...)
  - from: $FROM
    to: append(...)
    patterns:
    - pattern: append(..., $FROM, ...)
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  pattern-sanitizers:
  - pattern: strconv.Atoi(...)
  - pattern: strconv.ParseInt(...)
  - pattern: strconv.ParseUint(...)
  - pattern: strconv.ParseFloat(...)
  - pattern: strconv.ParseBool(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: exec.Command($ARG, ...)
      - pattern: exec.Command(..., $ARG, ...)
      - pattern: exec.CommandContext($CTX, $ARG, ...)
      - pattern: exec.CommandContext($CTX, ..., $ARG, ...)
      - pattern: os.StartProcess($ARG, ...)
      - pattern: os.StartProcess(..., $ARG, ...)
      - pattern: syscall.Exec($ARG, ...)
      - pattern: syscall.Exec(..., $ARG, ...)
    - focus-metavariable: $ARG
- id: path-traversal-arbitrary-file-read
  mode: taint
  severity: ERROR
  message: Detected untrusted user input from an HTTP request reaching a file system
    operation without sufficient path sanitization. An attacker could supply directory
    traversal sequences (e.g., '../') to access or read arbitrary files on the system.
    Use filepath.Base, filepath.IsLocal, or verify that the resolved path resides
    within the intended directory boundary.
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    technology:
    - go
    confidence: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/www-community/attacks/Path_Traversal
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
  - pattern: '($REQ : *http.Request).URL.Query()'
  - pattern: '($REQ : *http.Request).FormValue(...)'
  - pattern: '($REQ : *http.Request).PostFormValue(...)'
  - pattern: '($REQ : *http.Request).URL.Path'
  - pattern: '($REQ : *http.Request).PathValue(...)'
  - pattern: '($CTX : *gin.Context).Query(...)'
  - pattern: '($CTX : *gin.Context).Param(...)'
  - pattern: '($CTX : *gin.Context).PostForm(...)'
  - pattern: '($CTX : *GinContext).Query(...)'
  - pattern: '($CTX : *GinContext).Param(...)'
  - pattern: '($CTX : *GinContext).PostForm(...)'
  - pattern: '($CTX : echo.Context).FormValue(...)'
  - pattern: '($CTX : echo.Context).QueryParam(...)'
  - pattern: '($CTX : echo.Context).Param(...)'
  - pattern: '($CTX : EchoContext).FormValue(...)'
  - pattern: '($CTX : EchoContext).QueryParam(...)'
  - pattern: '($CTX : EchoContext).Param(...)'
  - pattern: '($CTX : *fiber.Ctx).Query(...)'
  - pattern: '($CTX : *fiber.Ctx).Params(...)'
  - pattern: '($CTX : *fiber.Ctx).FormValue(...)'
  - pattern: '($CTX : *FiberCtx).Query(...)'
  - pattern: '($CTX : *FiberCtx).Params(...)'
  - pattern: '($CTX : *FiberCtx).FormValue(...)'
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.Open($PATH)
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.ReadFile($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: os.Remove($PATH)
