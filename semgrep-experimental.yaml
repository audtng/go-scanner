rules:
- id: go-path-traversal
  mode: taint
  severity: ERROR
  message: Untrusted user input from an HTTP or web framework request flows into a
    filesystem operation without validation, leading to path traversal.
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    - 'CWE-23: Relative Path Traversal'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - go
    - net/http
    - gin
    - echo
    - fiber
    confidence: HIGH
    references:
    - https://owasp.org/www-community/attacks/Path_Traversal
    - https://cwe.mitre.org/data/definitions/22.html
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - pattern: '($R : *http.Request).URL.Query().Get(...)'
  - pattern: '($R : *http.Request).FormValue(...)'
  - pattern: '($R : *http.Request).PostFormValue(...)'
  - pattern: '($R : *http.Request).Header.Get(...)'
  - pattern: '($R : *http.Request).PathValue(...)'
  - pattern: (*gin.Context).Query(...)
  - pattern: '($C : *gin.Context).Query(...)'
  - pattern: '($C : *GinContext).Query(...)'
  - pattern: '($C : *gin.Context).Param(...)'
  - pattern: '($C : *GinContext).Param(...)'
  - pattern: '($C : *gin.Context).PostForm(...)'
  - pattern: '($C : *GinContext).PostForm(...)'
  - pattern: (echo.Context).FormValue(...)
  - pattern: '($C : echo.Context).FormValue(...)'
  - pattern: '($C : *EchoContext).FormValue(...)'
  - pattern: '($C : EchoContext).FormValue(...)'
  - pattern: '($C : echo.Context).QueryParam(...)'
  - pattern: '($C : *EchoContext).QueryParam(...)'
  - pattern: '($C : EchoContext).QueryParam(...)'
  - pattern: '($C : echo.Context).Param(...)'
  - pattern: '($C : *EchoContext).Param(...)'
  - pattern: '($C : EchoContext).Param(...)'
  - pattern: (*fiber.Ctx).Query(...)
  - pattern: '($C : *fiber.Ctx).Query(...)'
  - pattern: '($C : *FiberCtx).Query(...)'
  - pattern: '($C : *fiber.Ctx).Params(...)'
  - pattern: '($C : *FiberCtx).Params(...)'
  - pattern: '($C : *fiber.Ctx).FormValue(...)'
  - pattern: '($C : *FiberCtx).FormValue(...)'
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.Open($PATH)
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.ReadFile($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: os.Create($PATH)
      - pattern: os.Remove($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: http.Dir($PATH)
      - pattern: http.ServeFile($W, $R, $PATH)
      - pattern: (*gin.Context).File($PATH)
      - pattern: '($C : *gin.Context).File($PATH)'
      - pattern: '($C : *GinContext).File($PATH)'
      - pattern: (echo.Context).File($PATH)
      - pattern: '($C : echo.Context).File($PATH)'
      - pattern: '($C : *EchoContext).File($PATH)'
      - pattern: '($C : EchoContext).File($PATH)'
      - pattern: (*fiber.Ctx).SendFile($PATH)
      - pattern: '($C : *fiber.Ctx).SendFile($PATH)'
      - pattern: '($C : *FiberCtx).SendFile($PATH)'
    - focus-metavariable: $PATH
- id: go-path-traversal
  mode: taint
  severity: ERROR
  message: Untrusted input from an HTTP request or web framework parameter is used
    in a file path without sufficient sanitization, which can lead to path traversal
    and arbitrary file read/write.
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    - 'CWE-23: Relative Path Traversal'
    - 'CWE-73: External Control of File Name or Path'
    owasp:
    - A01:2021 - Broken Access Control
    - A05:2017 - Broken Access Control
    category: security
    technology:
    - go
    - net/http
    - gin
    - echo
    - fiber
    confidence: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/www-community/attacks/Path_Traversal
  languages:
  - go
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
  - pattern: (*http.Request).URL.Query().Get(...)
  - pattern: '($REQ : *http.Request).FormValue(...)'
  - pattern: (*http.Request).FormValue(...)
  - pattern: '($REQ : *http.Request).PostFormValue(...)'
  - pattern: (*http.Request).PostFormValue(...)
  - pattern: '($REQ : *http.Request).Header.Get(...)'
  - pattern: (*http.Request).Header.Get(...)
  - pattern: (*gin.Context).Query(...)
  - pattern: '($C : *gin.Context).Query(...)'
  - pattern: '($C : *GinContext).Query(...)'
  - pattern: (echo.Context).FormValue(...)
  - pattern: '($C : echo.Context).FormValue(...)'
  - pattern: '($C : EchoContext).FormValue(...)'
  - pattern: (*fiber.Ctx).Query(...)
  - pattern: '($C : *fiber.Ctx).Query(...)'
  - pattern: '($C : *FiberCtx).Query(...)'
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.RemoveAll($PATH)
      - pattern: os.Create($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: (*gin.Context).File($PATH)
      - pattern: '($C : *gin.Context).File($PATH)'
      - pattern: '($C : *GinContext).File($PATH)'
      - pattern: (echo.Context).File($PATH)
      - pattern: '($C : echo.Context).File($PATH)'
      - pattern: '($C : EchoContext).File($PATH)'
      - pattern: (*fiber.Ctx).SendFile($PATH)
      - pattern: '($C : *fiber.Ctx).SendFile($PATH)'
      - pattern: '($C : *FiberCtx).SendFile($PATH)'
    - focus-metavariable: $PATH
- id: generic-path-traversal
  mode: taint
  severity: ERROR
  message: Untrusted input used in file path operation without adequate validation
    may allow path traversal.
  languages:
  - go
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  metadata:
    category: security
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    - A05:2017 - Broken Access Control
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/www-community/attacks/Path_Traversal
    technology:
    - go
    confidence: HIGH
    subcategory:
    - vuln
    impact: HIGH
    likelihood: HIGH
  pattern-sources:
  - pattern: '($R : *bufio.Reader).ReadString(...)'
  - pattern: '($R : *bufio.Reader).ReadBytes(...)'
  - pattern: '($R : *bufio.Reader).ReadLine()'
  - pattern: '($S : *bufio.Scanner).Text()'
  - pattern: '($S : *bufio.Scanner).Bytes()'
  - pattern: io.ReadAll(...)
  - pattern: os.Args
  - pattern: flag.Arg(...)
  - pattern: flag.Args()
  - pattern: '($S : ssh.Session).Command()'
  - pattern: '($S : *ssh.Session).Command()'
  - pattern: '($REQ : *ssh.Request).Payload'
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: '($C : net.Conn).Read($BUF)'
      - pattern: '($R : io.Reader).Read($BUF)'
    - focus-metavariable: $BUF
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  - from: $FROM
    to: filepath.Clean(...)
    patterns:
    - pattern: filepath.Clean($FROM)
  - from: $FROM
    to: path.Clean(...)
    patterns:
    - pattern: path.Clean($FROM)
  - from: $FROM
    to: fmt.Sprintf(...)
    patterns:
    - pattern: fmt.Sprintf(..., $FROM, ...)
  - from: $FROM
    to: string(...)
    patterns:
    - pattern: string($FROM)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.Open($PATH)
      - pattern: os.Create($PATH)
      - pattern: os.ReadFile($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: os.Remove($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: os.Mkdir($PATH, ...)
      - pattern: os.MkdirAll($PATH, ...)
      - pattern: os.ReadDir($PATH)
      - pattern: os.Chtimes($PATH, ...)
      - pattern: filepath.Glob($PATH)
    - focus-metavariable: $PATH
- id: path-traversal-unmarshaled-data
  mode: taint
  severity: ERROR
  message: Untrusted unmarshaled data used in file system operation
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    - 'CWE-59: Improper Link Resolution Before File Access (''Link Following'')'
    owasp:
    - A01:2021 - Broken Access Control
    - A05:2025 - Broken Access Control
    confidence: HIGH
    impact: HIGH
    likelihood: MEDIUM
    subcategory:
    - vuln
    technology:
    - go
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://cwe.mitre.org/data/definitions/59.html
    - https://owasp.org/www-community/attacks/Path_Traversal
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: json.Unmarshal($DATA, &$TARGET)
      - pattern: yaml.Unmarshal($DATA, &$TARGET)
      - pattern: xml.Unmarshal($DATA, &$TARGET)
    - focus-metavariable: $TARGET
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  - from: $FROM
    to: filepath.Clean(...)
    patterns:
    - pattern: filepath.Clean($FROM)
  - from: $FROM
    to: path.Clean(...)
    patterns:
    - pattern: path.Clean($FROM)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  - by-side-effect: true
    patterns:
    - pattern: path.IsLocal($X)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.Open($PATH)
      - pattern: os.Create($PATH)
      - pattern: os.ReadFile($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: os.Remove($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: os.Mkdir($PATH, ...)
      - pattern: os.MkdirAll($PATH, ...)
      - pattern: os.Chmod($PATH, ...)
      - pattern: os.Chown($PATH, ...)
      - pattern: os.Lchown($PATH, ...)
      - pattern: os.Truncate($PATH, ...)
      - pattern: os.Readlink($PATH)
      - pattern: os.DirFS($PATH)
    - focus-metavariable: $PATH
- id: go-path-traversal
  mode: taint
  severity: ERROR
  message: Untrusted user input used in file path without proper validation can lead
    to path traversal vulnerabilities.
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    - A05:2017 - Broken Access Control
    category: security
    technology:
    - go
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/www-community/attacks/Path_Traversal
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
  - pattern: '($REQ : *http.Request).URL.Path'
  - pattern: '($REQ : *http.Request).URL.RawQuery'
  - pattern: '($REQ : *http.Request).FormValue(...)'
  - pattern: '($REQ : *http.Request).PostFormValue(...)'
  - pattern: '($REQ : *http.Request).Header.Get(...)'
  - pattern: (*gin.Context).Query(...)
  - pattern: '($C : *gin.Context).Query(...)'
  - pattern: (*GinContext).Query(...)
  - pattern: '($C : *GinContext).Query(...)'
  - pattern: (*gin.Context).Param(...)
  - pattern: '($C : *gin.Context).Param(...)'
  - pattern: (*gin.Context).PostForm(...)
  - pattern: '($C : *gin.Context).PostForm(...)'
  - pattern: (echo.Context).FormValue(...)
  - pattern: '($C : echo.Context).FormValue(...)'
  - pattern: (*echo.Context).FormValue(...)
  - pattern: '($C : *echo.Context).FormValue(...)'
  - pattern: (*EchoContext).FormValue(...)
  - pattern: '($C : *EchoContext).FormValue(...)'
  - pattern: (echo.Context).QueryParam(...)
  - pattern: '($C : echo.Context).QueryParam(...)'
  - pattern: (*fiber.Ctx).Query(...)
  - pattern: '($C : *fiber.Ctx).Query(...)'
  - pattern: (*FiberCtx).Query(...)
  - pattern: '($C : *FiberCtx).Query(...)'
  - pattern: (*fiber.Ctx).Params(...)
  - pattern: '($C : *fiber.Ctx).Params(...)'
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: json.Unmarshal($DATA, &$TARGET)
      - pattern: yaml.Unmarshal($DATA, &$TARGET)
    - focus-metavariable: $TARGET
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  - from: $FROM
    to: filepath.Clean(...)
    patterns:
    - pattern: filepath.Clean($FROM)
  - from: $FROM
    to: path.Clean(...)
    patterns:
    - pattern: path.Clean($FROM)
  - from: $FROM
    to: fmt.Sprintf(...)
    patterns:
    - pattern: fmt.Sprintf(..., $FROM, ...)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.Open($PATH)
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.ReadFile($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: os.Create($PATH)
      - pattern: os.Remove($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: http.Dir($PATH)
      - pattern: http.ServeFile($W, $REQ, $PATH)
      - pattern: http.FileSystem.Open($PATH)
      - pattern: (*gin.Context).File($PATH)
      - pattern: '($C : *gin.Context).File($PATH)'
      - pattern: (*GinContext).File($PATH)
      - pattern: '($C : *GinContext).File($PATH)'
      - pattern: (*gin.Context).FileAttachment($PATH, ...)
      - pattern: '($C : *gin.Context).FileAttachment($PATH, ...)'
      - pattern: (echo.Context).File($PATH)
      - pattern: '($C : echo.Context).File($PATH)'
      - pattern: (*echo.Context).File($PATH)
      - pattern: '($C : *echo.Context).File($PATH)'
      - pattern: (*EchoContext).File($PATH)
      - pattern: '($C : *EchoContext).File($PATH)'
      - pattern: (echo.Context).Attachment($PATH, ...)
      - pattern: '($C : echo.Context).Attachment($PATH, ...)'
      - pattern: (*fiber.Ctx).SendFile($PATH)
      - pattern: '($C : *fiber.Ctx).SendFile($PATH)'
      - pattern: (*FiberCtx).SendFile($PATH)
      - pattern: '($C : *FiberCtx).SendFile($PATH)'
      - pattern: (*fiber.Ctx).Download($PATH)
      - pattern: '($C : *fiber.Ctx).Download($PATH)'
    - focus-metavariable: $PATH
- id: archive-path-traversal
  mode: taint
  severity: ERROR
  message: Untrusted archive entry path used in file system operation without validation
    (Zip Slip / Tar Slip). An attacker can craft an archive with path traversal characters
    (such as '../') to write or overwrite arbitrary files outside the target directory.
    Validate that the extracted path resides within the intended destination directory
    using filepath.Rel, filepath.IsLocal, or a prefix check after cleaning.
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    - A05:2017 - Broken Access Control
    category: security
    technology:
    - go
    confidence: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    - https://snyk.io/research/zip-slip-vulnerability
  languages:
  - go
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: '($F : *zip.File).Name'
      - pattern: '($F : zip.File).Name'
      - pattern: '($F : *zip.FileHeader).Name'
      - pattern: '($F : zip.FileHeader).Name'
      - pattern: '($H : *tar.Header).Name'
      - pattern: '($H : tar.Header).Name'
      - pattern: '($H : *tar.Header).Linkname'
      - pattern: '($H : tar.Header).Linkname'
      - pattern: '($R : *tar.Reader).Next()'
      - pattern: '($R : tar.Reader).Next()'
      - pattern: '($R : *zip.Reader).File'
      - pattern: '($R : zip.Reader).File'
      - pattern: '($R : *zip.ReadCloser).File'
      - pattern: '($R : zip.ReadCloser).File'
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  - from: $FROM
    to: filepath.Clean(...)
    patterns:
    - pattern: filepath.Clean($FROM)
  - from: $FROM
    to: path.Clean(...)
    patterns:
    - pattern: path.Clean($FROM)
  - from: $FROM
    to: fmt.Sprintf(...)
    patterns:
    - pattern: fmt.Sprintf(..., $FROM, ...)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  - by-side-effect: true
    patterns:
    - pattern: strings.HasPrefix($PATH, ...)
    - focus-metavariable: $PATH
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.Open($PATH)
      - pattern: os.Create($PATH)
      - pattern: os.CreateTemp($PATH, ...)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: os.ReadFile($PATH)
      - pattern: os.Mkdir($PATH, ...)
      - pattern: os.MkdirAll($PATH, ...)
      - pattern: os.Remove($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: os.Truncate($PATH, ...)
      - pattern: os.Chmod($PATH, ...)
      - pattern: os.Chown($PATH, ...)
      - pattern: os.Symlink(..., $PATH)
      - pattern: os.Link(..., $PATH)
      - pattern: os.Rename($PATH, ...)
      - pattern: os.Rename(..., $PATH)
    - focus-metavariable: $PATH
- id: archive-path-traversal
  mode: taint
  severity: ERROR
  languages:
  - go
  message: Untrusted archive entry path or linkname is used in filesystem operations
    without validation, allowing directory traversal (Zip Slip / Tar Slip).
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    - A05:2017 - Broken Access Control
    category: security
    technology:
    - go
    confidence: HIGH
    subcategory:
    - vuln
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/www-community/attacks/Path_Traversal
    - https://snyk.io/research/zip-slip-vulnerability
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - pattern: '($HDR : *tar.Header).Name'
  - pattern: '($HDR : tar.Header).Name'
  - pattern: '($HDR : *tar.Header).Linkname'
  - pattern: '($HDR : tar.Header).Linkname'
  - pattern: '($FILE : *zip.File).Name'
  - pattern: '($FILE : zip.File).Name'
  - pattern: '($FH : *zip.FileHeader).Name'
  - pattern: '($FH : zip.FileHeader).Name'
  - patterns:
    - pattern: $HDR.Name
    - pattern-inside: '$HDR, ... := $TR.Next(...)

        ...

        '
  - patterns:
    - pattern: $HDR.Linkname
    - pattern-inside: '$HDR, ... := $TR.Next(...)

        ...

        '
  - patterns:
    - pattern: $FILE.Name
    - pattern-inside: "for ..., $FILE := range $ZR.File {\n  ...\n}\n"
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  - from: $FROM
    to: filepath.Clean(...)
    patterns:
    - pattern: filepath.Clean($FROM)
  - from: $FROM
    to: fmt.Sprintf(...)
    patterns:
    - pattern: fmt.Sprintf(..., $FROM, ...)
