rules:
- id: go-archive-path-traversal-file-write
  mode: taint
  languages:
  - go
  severity: ERROR
  message: Detected archive extraction path traversal (Zip Slip / Tar Slip). Archive
    entry names originating from 'tar.Header' or 'zip.File' are controlled by the
    archive creator and can contain directory traversal sequences ('../'). Constructing
    file paths with these entries and passing them directly to file creation or modification
    functions without verifying containment (e.g., via 'filepath.IsLocal' or path
    prefix validation) allows arbitrary file overwrite outside the destination directory.
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    - A05:2017 - Broken Access Control
    category: security
    confidence: HIGH
    impact: HIGH
    likelihood: HIGH
    references:
    - https://nvd.nist.gov/vuln/detail/CVE-2023-45141
    - https://github.com/advisories/GHSA-2657-3c98-63jq
    - https://snyk.io/research/zip-slip-vulnerability
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
    taint_assume_safe_numbers: true
  pattern-sources:
  - pattern: '($HDR : *tar.Header).Name'
  - pattern: '($HDR : tar.Header).Name'
  - pattern: '($HDR : *tar.Header).Linkname'
  - pattern: '($HDR : tar.Header).Linkname'
  - pattern: '($FILE : *zip.File).Name'
  - pattern: '($FILE : zip.File).Name'
  - pattern: '($FH : *zip.FileHeader).Name'
  - pattern: '($FH : zip.FileHeader).Name'
  - patterns:
    - pattern: $HDR.Name
    - pattern-either:
      - pattern-inside: '$HDR, ... := ($TR : *tar.Reader).Next(...)

          ...

          '
      - pattern-inside: '$HDR, ... = ($TR : *tar.Reader).Next(...)

          ...

          '
  - patterns:
    - pattern: $FILE.Name
    - pattern-either:
      - pattern-inside: 'for ..., $FILE := range ($ZR : *zip.Reader).File { ... }

          '
      - pattern-inside: 'for ..., $FILE := range ($ZR : zip.Reader).File { ... }

          '
      - pattern-inside: 'for ..., $FILE := range ($ZR : *zip.ReadCloser).File { ...
          }

          '
      - pattern-inside: 'for ..., $FILE := range ($ZR : zip.ReadCloser).File { ...
          }

          '
  pattern-propagators:
  - pattern: filepath.Join(..., $X, ...)
    from: $X
    to: filepath.Join(...)
  - pattern: path.Join(..., $X, ...)
    from: $X
    to: path.Join(...)
  - pattern: filepath.Clean($X)
    from: $X
    to: filepath.Clean($X)
  - pattern: path.Clean($X)
    from: $X
    to: path.Clean($X)
  - pattern: filepath.FromSlash($X)
    from: $X
    to: filepath.FromSlash($X)
  - pattern: filepath.ToSlash($X)
    from: $X
    to: filepath.ToSlash($X)
  pattern-sanitizers:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: filepath.IsLocal($VAR)
      - pattern: strings.HasPrefix($VAR, ...)
      - pattern: filepath.Rel(..., $VAR)
    - focus-metavariable: $VAR
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.Create($VAR)
      - pattern: os.OpenFile($VAR, ...)
      - pattern: os.WriteFile($VAR, ...)
      - pattern: os.Mkdir($VAR, ...)
      - pattern: os.MkdirAll($VAR, ...)
      - pattern: os.CreateTemp($VAR, ...)
      - pattern: os.CreateTemp(..., $VAR)
      - pattern: os.Rename($VAR, ...)
      - pattern: os.Rename(..., $VAR)
      - pattern: os.Remove($VAR)
      - pattern: os.RemoveAll($VAR)
      - pattern: os.Truncate($VAR, ...)
    - focus-metavariable: $VAR
- id: path-traversal-unmarshaled-data
  mode: taint
  severity: ERROR
  message: Untrusted path component from deserialized data is used in a filesystem
    operation without path traversal validation. Ensure paths are verified using filepath.IsLocal
    or checked to remain within the target root directory.
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    - 'CWE-73: External Control of File Name or Path'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - go
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/www-community/attacks/Path_Traversal
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: json.Unmarshal($DATA, &$TARGET)
      - pattern: yaml.Unmarshal($DATA, &$TARGET)
      - pattern: xml.Unmarshal($DATA, &$TARGET)
    - focus-metavariable: $TARGET
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.Open($PATH)
      - pattern: os.Create($PATH)
      - pattern: os.ReadFile($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: os.Remove($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: os.Mkdir($PATH, ...)
      - pattern: os.MkdirAll($PATH, ...)
      - pattern: os.Stat($PATH)
      - pattern: os.Lstat($PATH)
      - pattern: os.Truncate($PATH, ...)
      - pattern: os.ReadDir($PATH)
      - pattern: os.DirFS($PATH)
    - focus-metavariable: $PATH
- id: go-path-traversal
  mode: taint
  severity: ERROR
  message: Untrusted user input flows into a filesystem operation without adequate
    path containment verification. This can lead to arbitrary file read, write, or
    traversal attacks (CWE-22). Validate paths using secure containment checks such
    as filepath.IsLocal before accessing the filesystem.
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    confidence: HIGH
    likelihood: HIGH
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - go
    - gin
    - echo
    - fiber
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://pkg.go.dev/path/filepath#IsLocal
  languages:
  - go
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
    taint_assume_safe_numbers: true
  pattern-sources:
  - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
  - pattern: '($REQ : *http.Request).URL.Path'
  - pattern: '($REQ : *http.Request).FormValue(...)'
  - pattern: '($REQ : *http.Request).PostFormValue(...)'
  - pattern: '($CTX : *gin.Context).Query(...)'
  - pattern: '($CTX : *gin.Context).Param(...)'
  - pattern: '($CTX : *gin.Context).PostForm(...)'
  - pattern: '($CTX : echo.Context).FormValue(...)'
  - pattern: '($CTX : echo.Context).QueryParam(...)'
  - pattern: '($CTX : *fiber.Ctx).Query(...)'
  - pattern: '($CTX : *fiber.Ctx).Params(...)'
  pattern-propagators:
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  - from: $FROM
    to: filepath.Clean(...)
    patterns:
    - pattern: filepath.Clean($FROM)
  - from: $FROM
    to: path.Clean(...)
    patterns:
    - pattern: path.Clean($FROM)
  - from: $FROM
    to: fmt.Sprintf(...)
    patterns:
    - pattern: fmt.Sprintf(..., $FROM, ...)
  pattern-sanitizers:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: filepath.IsLocal($VAR)
      - pattern: fs.ValidPath($VAR)
      - pattern: io/fs.ValidPath($VAR)
    - focus-metavariable: $VAR
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.Open($PATH)
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.ReadFile($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: os.Create($PATH)
      - pattern: os.Remove($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: os.DirFS($PATH)
      - pattern: http.Dir($PATH)
      - pattern: http.ServeFile($W, $REQ, $PATH)
      - pattern: '($FS : fs.FS).Open($PATH)'
      - pattern: '($FS : http.FileSystem).Open($PATH)'
      - pattern: fs.ReadFile($FS, $PATH)
    - focus-metavariable: $PATH
- id: go-path-traversal
  mode: taint
  severity: ERROR
  languages:
  - go
  message: Untrusted user input flows into a file system operation without proper
    path containment validation. Functions such as filepath.Join and filepath.Clean
    resolve dot segments but do not prevent directory traversal outside the intended
    directory. Use filepath.IsLocal (Go 1.20+) or verify that the resolved path is
    contained within the intended base directory.
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - go
    - net/http
    - gin
    - echo
    - fiber
    confidence: HIGH
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    - https://github.com/advisories/GHSA-2fp4-5v5c-4448
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  options:
    taint_assume_safe_booleans: true
  pattern-sources:
  - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
  - pattern: '($REQ : *http.Request).FormValue(...)'
  - pattern: '($REQ : *http.Request).PostFormValue(...)'
  - pattern: '($REQ : *http.Request).Header.Get(...)'
  - pattern: '($REQ : *http.Request).PathValue(...)'
  - pattern: '($REQ : *http.Request).URL.Path'
  - pattern: '($REQ : *http.Request).URL.RawQuery'
  - pattern: (*gin.Context).Query(...)
  - pattern: '($CTX : *gin.Context).Query(...)'
  - pattern: (*gin.Context).Param(...)
  - pattern: '($CTX : *gin.Context).Param(...)'
  - pattern: (*gin.Context).DefaultQuery(...)
  - pattern: '($CTX : *gin.Context).DefaultQuery(...)'
  - pattern: (*gin.Context).PostForm(...)
  - pattern: '($CTX : *gin.Context).PostForm(...)'
  - pattern: '($CTX : *GinContext).Query(...)'
  - pattern: '($CTX : *GinContext).Param(...)'
  - pattern: (echo.Context).FormValue(...)
  - pattern: '($CTX : echo.Context).FormValue(...)'
  - pattern: (echo.Context).QueryParam(...)
  - pattern: '($CTX : echo.Context).QueryParam(...)'
  - pattern: (echo.Context).Param(...)
  - pattern: '($CTX : echo.Context).Param(...)'
  - pattern: '($CTX : EchoContext).FormValue(...)'
  - pattern: '($CTX : EchoContext).QueryParam(...)'
  - pattern: '($CTX : EchoContext).Param(...)'
  - pattern: (*fiber.Ctx).Query(...)
  - pattern: '($CTX : *fiber.Ctx).Query(...)'
  - pattern: (*fiber.Ctx).Params(...)
  - pattern: '($CTX : *fiber.Ctx).Params(...)'
  - pattern: (*fiber.Ctx).FormValue(...)
  - pattern: '($CTX : *fiber.Ctx).FormValue(...)'
  - pattern: '($CTX : *FiberCtx).Query(...)'
  - pattern: '($CTX : *FiberCtx).Params(...)'
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: json.Unmarshal($DATA, &$TARGET)
      - pattern: yaml.Unmarshal($DATA, &$TARGET)
    - focus-metavariable: $TARGET
  pattern-propagators:
  - from: $FROM
    to: base64.StdEncoding.DecodeString(...)
    patterns:
    - pattern: base64.StdEncoding.DecodeString($FROM)
  - from: $FROM
    to: base64.URLEncoding.DecodeString(...)
    patterns:
    - pattern: base64.URLEncoding.DecodeString($FROM)
  - from: $FROM
    to: base64.RawURLEncoding.DecodeString(...)
    patterns:
    - pattern: base64.RawURLEncoding.DecodeString($FROM)
  - from: $FROM
    to: base64.RawStdEncoding.DecodeString(...)
    patterns:
    - pattern: base64.RawStdEncoding.DecodeString($FROM)
  - from: $FROM
    to: string(...)
    patterns:
    - pattern: string($FROM)
  - from: $FROM
    to: filepath.Join(...)
    patterns:
    - pattern: filepath.Join(..., $FROM, ...)
  - from: $FROM
    to: path.Join(...)
    patterns:
    - pattern: path.Join(..., $FROM, ...)
  - from: $FROM
    to: filepath.Clean(...)
    patterns:
    - pattern: filepath.Clean($FROM)
  - from: $FROM
    to: path.Clean(...)
    patterns:
    - pattern: path.Clean($FROM)
  - from: $FROM
    to: fmt.Sprintf(...)
    patterns:
    - pattern: fmt.Sprintf(..., $FROM, ...)
  - from: $FROM
    to: strings.Replace(...)
    patterns:
    - pattern: strings.Replace($FROM, ...)
  - from: $FROM
    to: strings.ReplaceAll(...)
    patterns:
    - pattern: strings.ReplaceAll($FROM, ...)
  - from: $FROM
    to: url.QueryUnescape(...)
    patterns:
    - pattern: url.QueryUnescape($FROM)
  - from: $FROM
    to: url.PathUnescape(...)
    patterns:
    - pattern: url.PathUnescape($FROM)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - by-side-effect: true
    patterns:
    - pattern: filepath.IsLocal($X)
    - focus-metavariable: $X
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: strings.HasPrefix($X, "..")
      - pattern: strings.HasPrefix($X, ".." + ...)
      - pattern: strings.HasPrefix($X,$BASE)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.Open($PATH)
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.Create($PATH)
      - pattern: os.ReadFile($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: os.Remove($PATH)
      - pattern: os.RemoveAll($PATH)
      - pattern: os.Stat($PATH)
      - pattern: os.Lstat($PATH)
      - pattern: os.Truncate($PATH, ...)
      - pattern: os.DirFS($PATH)
      - pattern: ioutil.ReadFile($PATH)
      - pattern: ioutil.WriteFile($PATH, ...)
      - pattern: http.Dir($PATH)
      - pattern: http.ServeFile($W, $R,$PATH)
      - pattern: (*gin.Context).File($PATH, ...)
      - pattern: '($CTX : *gin.Context).File($PATH, ...)'
      - pattern: (*gin.Context).FileAttachment($PATH, ...)
      - pattern: '($CTX : *gin.Context).FileAttachment($PATH, ...)'
      - pattern: '($CTX : *GinContext).File($PATH, ...)'
      - pattern: (echo.Context).File($PATH)
      - pattern: '($CTX : echo.Context).File($PATH)'
      - pattern: (echo.Context).Attachment($PATH, ...)
      - pattern: '($CTX : echo.Context).Attachment($PATH, ...)'
      - pattern: (echo.Context).Inline($PATH, ...)
      - pattern: '($CTX : echo.Context).Inline($PATH, ...)'
      - pattern: '($CTX : EchoContext).File($PATH)'
      - pattern: (*fiber.Ctx).SendFile($PATH, ...)
      - pattern: '($CTX : *fiber.Ctx).SendFile($PATH, ...)'
      - pattern: (*fiber.Ctx).Download($PATH, ...)
      - pattern: '($CTX : *fiber.Ctx).Download($PATH, ...)'
      - pattern: '($CTX : *FiberCtx).SendFile($PATH, ...)'
    - focus-metavariable: $PATH
- id: untrusted-config-command-injection
  mode: taint
  severity: ERROR
  message: Untrusted configuration data unmarshaled from JSON/YAML/XML/TOML is passed
    directly into  command execution arguments without sanitization, leading to argument
    injection.  Because Go's exec.Command does not invoke a shell, standard escaping
    functions like  strconv.Quote do NOT prevent this vulnerability. An attacker can
    inject arbitrary flags  (e.g., --sandbox=none). To mitigate this, enforce a strict
    allowlist of permitted  arguments or disable the passing of arbitrary extra arguments
    entirely.
  languages:
  - go
  options:
    taint_assume_safe_booleans: true
  paths:
    exclude:
    - '*_test.go'
    - test/**/*.go
    - mock/**/*.go
  metadata:
    category: security
    cwe:
    - 'CWE-88: Improper Neutralization of Argument Delimiters in a Command (''Argument
      Injection'')'
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS
      Command Injection'')'
    owasp:
    - A03:2021 - Injection
    references:
    - https://cwe.mitre.org/data/definitions/88.html
    - https://cwe.mitre.org/data/definitions/78.html
    - https://owasp.org/Top10/A03_2021-Injection/
    - https://github.com/advisories/GHSA-2gv2-cffp-j227
    confidence: MEDIUM
  pattern-sources:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: json.Unmarshal($DATA, &$TARGET)
      - pattern: json.Unmarshal($DATA, $TARGET)
      - pattern: yaml.Unmarshal($DATA, &$TARGET)
      - pattern: yaml.Unmarshal($DATA, $TARGET)
      - pattern: xml.Unmarshal($DATA, &$TARGET)
      - pattern: xml.Unmarshal($DATA, $TARGET)
      - pattern: toml.Unmarshal($DATA, &$TARGET)
      - pattern: toml.Unmarshal($DATA, $TARGET)
      - pattern: $DEC.Decode(&$TARGET)
      - pattern: $DEC.Decode($TARGET)
    - focus-metavariable: $TARGET
  pattern-propagators:
  - from: $FROM
    to: fmt.Sprintf(...)
    patterns:
    - pattern: fmt.Sprintf(..., $FROM, ...)
  - from: $FROM
    to: strings.Split(...)
    patterns:
    - pattern: strings.Split($FROM, ...)
  - from: $FROM
    to: strings.Fields(...)
    patterns:
    - pattern: strings.Fields($FROM)
  - from: $FROM
    to: strings.Join(...)
    patterns:
    - pattern: strings.Join($FROM, ...)
    - pattern: strings.Join(..., $FROM)
  - from: $FROM
    to: $TO
    patterns:
    - pattern: $TO = append($TO, ..., $FROM, ...)
    - pattern: $TO = append($TO, $FROM...)
  pattern-sanitizers:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: isAllowed($X, ...)
      - pattern: validateArg($X, ...)
      - pattern: checkAllowlist($X, ...)
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: exec.Command($BIN, ..., $ARG...)
      - pattern: exec.CommandContext($CTX, $BIN, ..., $ARG...)
      - pattern: exec.Command($BIN, ..., $ARG, ...)
      - pattern: exec.CommandContext($CTX, $BIN, ..., $ARG, ...)
      - pattern: syscall.Exec($BIN, $ARG, ...)
      - pattern: syscall.ForkExec($BIN, $ARG, ...)
      - pattern: syscall.StartProcess($BIN, $ARG, ...)
      - pattern: os.StartProcess($BIN, $ARG, ...)
      - pattern: $CMD.Args = $ARG
      - pattern: $CMD.Args = append($CMD.Args, ..., $ARG, ...)
      - pattern: $CMD.Args = append($CMD.Args, $ARG...)
      - pattern: 'exec.Cmd{..., Path: $ARG, ...}'
      - pattern: 'exec.Cmd{..., Args: $ARG, ...}'
    - focus-metavariable: $ARG
- id: go-path-traversal
  mode: taint
  severity: ERROR
  message: Potential path traversal vulnerability detected. Untrusted user input from
    an HTTP request is used in a file path without adequate validation or sanitization.
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    confidence: HIGH
    subcategories:
    - vuln
    references:
    - https://github.com/advisories/GHSA-2h2p-mvfx-868w
  paths:
